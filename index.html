<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#11110f" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Sonora — a fast, offline-capable sheet music library and score viewer" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonora" />
    <title>Sonora — Sheet Music Library</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #11110f; }
      #startup-error { box-sizing: border-box; width: min(760px, calc(100% - 48px)); margin: 0 auto; padding-top: 18vh; color: #f5f5f4; font: 15px/1.5 system-ui, sans-serif; }
      #startup-error strong { font-size: 18px; }
      #startup-error pre { margin-top: 14px; padding: 14px; border-radius: 10px; background: #1b1b18; color: #d7d7d1; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="startup-error" hidden>
      <strong>Sonora could not start.</strong>
      <pre id="startup-error-message"></pre>
    </div>
    <script>
      (() => {
        const showError = (reason) => {
          const container = document.getElementById('startup-error');
          const message = document.getElementById('startup-error-message');
          if (!container || !message) return;
          const value = reason instanceof Error
            ? (reason.stack || reason.message)
            : typeof reason === 'string'
              ? reason
              : String(reason ?? 'Unknown startup error');
          message.textContent = value;
          container.hidden = false;
        };
        window.addEventListener('error', (event) => {
          if (event instanceof ErrorEvent) showError(event.error || event.message);
        });
        window.addEventListener('unhandledrejection', (event) => showError(event.reason));
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

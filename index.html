<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#11110f" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Sonora — a fast, offline-capable sheet music library and score viewer" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonora" />
    <title>Sonora — Sheet Music Library</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #11110f; }
      #startup-fallback { box-sizing: border-box; min-height: 100%; display: grid; place-items: center; padding: 32px; background: #11110f; color: #f5f5f4; font: 14px/1.5 system-ui, sans-serif; }
      #startup-fallback > section { width: min(760px, 100%); padding: 28px; border: 1px solid #3a3a35; border-radius: 16px; background: #191914; }
      #startup-fallback h1 { margin: 0 0 10px; font-size: 24px; }
      #startup-fallback p { margin: 0; color: #c8c8c1; }
    </style>
  </head>
  <body>
    <div id="app"><main id="startup-fallback"><section><h1>Starting Sonora…</h1><p>If this screen remains visible, Sonora's JavaScript bundle did not finish loading.</p></section></main></div>
    <script>
      window.addEventListener('error', function (event) {
        var fallback = document.getElementById('startup-fallback');
        if (!fallback) return;
        var detail = event.error && event.error.message ? event.error.message : (event.message || 'Unknown startup error');
        fallback.innerHTML = '<section><h1>Sonora could not start</h1><p>' + String(detail).replace(/[&<>]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]); }) + '</p></section>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var fallback = document.getElementById('startup-fallback');
        if (!fallback) return;
        var reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || 'Unknown startup error');
        fallback.innerHTML = '<section><h1>Sonora could not start</h1><p>' + reason.replace(/[&<>]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]); }) + '</p></section>';
      });
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

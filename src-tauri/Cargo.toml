[package]
name = "sonora"
version = "1.3.0"
description = "Sonora sheet music library and score viewer"
authors = ["Austin Tallent"]
edition = "2021"
license = "MIT"
rust-version = "1.92"

[lib]
name = "sonora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
markup5ever = "0.38"

ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-31"] }

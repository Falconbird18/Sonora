[package]
name = "sonora"
version = "0.1.0"
description = "Sonora sheet music library and score viewer"
authors = ["Austin Tallent"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "sonora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: PDFium Verify

on:
  push:
    branches:
      - feature/pdfium-renderer-migration

permissions:
  contents: write

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[pdfium-verify]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pdfium-verify.yml
          git commit -m 'Remove temporary PDFium verification workflow [pdfium-verify]'
          git push

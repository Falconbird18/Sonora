name: Apply annotation durability patch

on:
  push:
    branches:
      - fix/windows-blank-and-annotation-durability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[annotation-patch]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-blank-and-annotation-durability

      - name: Patch ScoreViewer persistence
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/ScoreViewer.svelte')
          s = p.read_text()

          s = s.replace(
              "import { db } from './db';",
              "import { loadAnnotations, saveAnnotation, flushAnnotationSaves, requestPersistentStorage } from './annotationStore';"
          )
          s = s.replace(
              "let isFullscreen = $state(false);",
              "let isFullscreen = $state(false);\n\n\tasync function flushPendingAnnotations() {\n\t\tconst pages = [...saveTimers.keys()];\n\t\tfor (const number of pages) {\n\t\t\tconst timer = saveTimers.get(number);\n\t\t\tif (timer) clearTimeout(timer);\n\t\t\tsaveTimers.delete(number);\n\t\t\tawait saveAnnotations(number);\n\t\t}\n\t\tawait flushAnnotationSaves();\n\t}"
          )
          s = s.replace(
              "\t\tvoid load();",
              "\t\trequestPersistentStorage();\n\t\tvoid load();"
          )
          s = s.replace(
              "const records = await db.annotations.where('scoreId').equals(score.id).toArray();",
              "const records = await loadAnnotations(score.id);"
          )
          s = s.replace(
              "\tasync function leave() {\n\t\tclosed = true;",
              "\tasync function leave() {\n\t\tawait flushPendingAnnotations();\n\t\tclosed = true;"
          )
          s = s.replace(
              "\t\t\tfor (const timer of saveTimers.values()) clearTimeout(timer);",
              "\t\t\tvoid flushPendingAnnotations();"
          )
          s = s.replace(
              "\tfunction scheduleSave(number: number) {\n\t\tconst old = saveTimers.get(number);\n\t\tif (old) clearTimeout(old);\n\t\tsaveTimers.set(number, setTimeout(() => void saveAnnotations(number), 250));\n\t}\n\tasync function saveAnnotations(number: number) {\n\t\tawait db.annotations.put({\n\t\t\tid: `${score.id}:${number}`,\n\t\t\tscoreId: score.id,\n\t\t\tpageNum: number,\n\t\t\tstrokes: $state.snapshot(strokes[number] || []),\n\t\t\tstamps: $state.snapshot(stamps[number] || []),\n\t\t\tnotes: $state.snapshot(notes[number] || [])\n\t\t});\n\t}",
              "\tfunction scheduleSave(number: number) {\n\t\tconst old = saveTimers.get(number);\n\t\tif (old) clearTimeout(old);\n\t\tsaveTimers.set(number, setTimeout(() => {\n\t\t\tsaveTimers.delete(number);\n\t\t\tvoid saveAnnotations(number).catch((error) => console.error('Annotation save failed', error));\n\t\t}, 150));\n\t}\n\tasync function saveAnnotations(number: number) {\n\t\tawait saveAnnotation(score.id, number, {\n\t\t\tstrokes: $state.snapshot(strokes[number] || []),\n\t\t\tstamps: $state.snapshot(stamps[number] || []),\n\t\t\tnotes: $state.snapshot(notes[number] || [])\n\t\t});\n\t}"
          )
          p.write_text(s)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ScoreViewer.svelte .github/workflows/apply-annotation-durability.yml
          git rm .github/workflows/apply-annotation-durability.yml
          git diff --cached --quiet && exit 0
          git commit -m "Harden annotation saves and shutdown flushing [annotation-patch]"
          git push origin HEAD:fix/windows-blank-and-annotation-durability

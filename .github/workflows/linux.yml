name: Linux Desktop Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build Linux packages
        env:
          NO_STRIP: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          SONORA_BUILD_APPIMAGE: '1'
        run: npm run tauri:build

      - name: Make AppImage portable (strip conflicting Wayland libs)
        run: |
          set -euo pipefail

          # Download a recent appimagetool (static) for repacking
          wget -q -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

          shopt -s nullglob
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            echo "Processing $appimage ..."
            workdir=$(mktemp -d)
            cd "$workdir"

            # Extract
            "$appimage" --appimage-extract

            # Remove the libs that break EGL on modern Mesa / Wayland hosts.
            # These are on the official AppImage excludelist for this reason.
            find squashfs-root -type f \( \
              -name 'libwayland-client.so*' -o \
              -name 'libwayland-cursor.so*' -o \
              -name 'libwayland-egl.so*' -o \
              -name 'libwayland-server.so*' \
            \) -print -delete || true

            # Repack (no FUSE needed on the runner)
            ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
              squashfs-root "$appimage"

            cd -
            rm -rf "$workdir"
            echo "Portable AppImage written: $appimage"
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: sonora-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

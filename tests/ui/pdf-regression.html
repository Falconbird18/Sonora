<!doctype html>
<html lang="en">
	<meta charset="utf-8" /><title>PDF renderer regression</title>
	<body>
		<h1>PDF renderer regression</h1>
		<pre id="result" role="status">Running…</pre>
		<script type="module">
			import { pdfiumRenderer } from '../../src/lib/pdfiumRenderer.ts';
			if (!import.meta.env.DEV) throw Error('Development-only verification');
			const objects = [
				'<< /Type /Catalog /Pages 2 0 R >>',
				'<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
				'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
				'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'
			];
			const content = 'BT /F1 20 Tf 40 700 Td (Sonora concurrency test) Tj ET';
			objects.push(
				`<< /Length ${content.length} >>\nstream\n${content}\nendstream`
			);
			let pdf = '%PDF-1.4\n',
				offsets = [0];
			objects.forEach((object, i) => {
				offsets.push(pdf.length);
				pdf += `${i + 1} 0 obj\n${object}\nendobj\n`;
			});
			const xref = pdf.length;
			pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
			for (const offset of offsets.slice(1))
				pdf += `${String(offset).padStart(10, '0')} 00000 n \n`;
			pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
			let first, second;
			try {
				const bytes = new TextEncoder().encode(pdf);
				first = await pdfiumRenderer.open(bytes, 'same-score.pdf');
				second = await pdfiumRenderer.open(bytes, 'same-score.pdf');
				await first.close();
				first = null;
				const text = await second.getPageText(0);
				if (!text.includes('Sonora concurrency test'))
					throw Error(`Text extraction returned ${text}`);
				const image = await second.renderPage(0, { scale: 0.2 });
				if (!image.blob.size || !image.blob.type.startsWith('image/'))
					throw Error('Empty rendered image');
				document.getElementById('result').textContent =
					'PASS: independent handles for the same filename; closing one leaves the other readable and renderable. PDF text extraction works.';
			} catch (error) {
				document.getElementById('result').textContent =
					`FAIL: ${error.message}`;
				console.error(error);
			} finally {
				await first?.close();
				await second?.close();
			}
		</script>
	</body>
</html>
